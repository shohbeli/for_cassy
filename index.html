<!DOCTYPE html>
<html lang="en" data-theme="light" data-size="m">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FFF6FA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cassy">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>1000 Things to Write About Cassy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{--bg:#FFF6FA;--blob1:#FFD3E4;--blob2:#FFE3D3;--blob3:#EADCFF;--surface:#FFFFFF;--paper:#FFFFFF;--ink:#43213A;--muted:#85566F;--accent:#C42E68;--accent-2:#A3245A;--chip:#FFE3EE;--chip-ink:#A3245A;--line:#F7D3E2;--border:#F6D5E3;--soft:#FFF0F6;--g1:#FF8CB8;--g2:#FFAE94;--btn-ink:#4A0E2B;--track:#FFE3EE;--danger:#B42350;--shadow:0 2px 6px rgba(196,46,104,.06),0 12px 30px rgba(196,46,104,.09);--ans-size:19px;--ans-lh:36px;color-scheme:light}
[data-theme=dark]{--bg:#1C1018;--blob1:#3A1830;--blob2:#3A2020;--blob3:#2A1F44;--surface:#28161F;--paper:#28161F;--ink:#FFE6F1;--muted:#D9A9C3;--accent:#FF8DBB;--accent-2:#FFB3D1;--chip:#46203A;--chip-ink:#FFC7DE;--line:#4E2B3E;--border:#46283A;--soft:#2F1A26;--g1:#FF8DBB;--g2:#FFA894;--btn-ink:#3A0D25;--track:#3A2230;--danger:#FF8FA8;--shadow:0 2px 6px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.3);color-scheme:dark}
[data-size=s]{--ans-size:17px;--ans-lh:32px}
[data-size=l]{--ans-size:22px;--ans-lh:42px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;transition:transform .15s cubic-bezier(.3,.7,.4,1.5),box-shadow .2s,background .2s}
button:active:not(:disabled){transform:scale(.96)}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:10px}
svg{flex-shrink:0}
p{margin:0}
h1,h2,h3{margin:0;font-weight:500}
.bgblobs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bgblobs i{position:absolute;border-radius:50%;filter:blur(40px);opacity:.7;animation:drift 18s ease-in-out infinite alternate}
.bgblobs i:nth-child(1){width:320px;height:320px;background:var(--blob1);top:-80px;left:-90px}
.bgblobs i:nth-child(2){width:260px;height:260px;background:var(--blob2);top:40%;right:-100px;animation-delay:-6s}
.bgblobs i:nth-child(3){width:280px;height:280px;background:var(--blob3);bottom:-100px;left:10%;animation-delay:-12s}
@keyframes drift{to{transform:translate(40px,30px) scale(1.12)}}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative}
.has-tabs{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.has-pager{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.screen{padding:22px 20px 28px;display:flex;flex-direction:column;gap:16px}
.screen>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.screen>*:nth-child(2){animation-delay:.04s}.screen>*:nth-child(3){animation-delay:.08s}.screen>*:nth-child(4){animation-delay:.12s}.screen>*:nth-child(5){animation-delay:.16s}.screen>*:nth-child(6){animation-delay:.2s}.screen>*:nth-child(7){animation-delay:.24s}.screen>*:nth-child(n+8){animation-delay:.28s}
.center>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.center>*:nth-child(2){animation-delay:.06s}.center>*:nth-child(3){animation-delay:.12s}.center>*:nth-child(4){animation-delay:.18s}.center>*:nth-child(n+5){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.serif{font-family:Fredoka,Nunito,sans-serif;font-weight:600}
.hand{font-family:Nunito,sans-serif;font-weight:800}
.muted{color:var(--muted)}
.small{font-size:13px}
.kicker{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.cover{display:flex;flex-direction:column;gap:6px;padding-top:6px}
.cover-name{font-family:Fredoka,sans-serif;font-size:66px;font-weight:600;line-height:.95;letter-spacing:-.01em}
.tagline{font-size:18px;color:var(--accent);font-weight:800}
.logo{font-size:60px;line-height:1;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(-4deg)}}
.hero{border-radius:28px;padding:22px 20px;background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--btn-ink);position:relative;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px}
.hero::after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.25);right:-55px;top:-65px}
.hero>*{position:relative;z-index:1}
.hero .kicker{color:var(--btn-ink);opacity:.75}
.hero .cover-name{font-size:58px;color:var(--btn-ink)}
.hero .tagline{color:var(--btn-ink);opacity:.85;font-size:16px}
.hero .hrow{display:flex;align-items:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
.hero .big{font-family:Fredoka,sans-serif;font-size:42px;font-weight:600;line-height:1}
.hero .bar{background:rgba(255,255,255,.45);margin-top:10px}
.hero .bar>span{background:#fff}
.hero .sub{font-weight:800;opacity:.85;margin-top:8px;font-size:14px}
.hero .pill{background:rgba(255,255,255,.55);color:var(--btn-ink);margin-left:auto}
.card{background:var(--surface);border:1.5px solid var(--border);border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;text-align:left;box-shadow:var(--shadow)}
button.card{width:100%;font:inherit}
.card-title{font-size:13px;font-weight:800;color:var(--muted);display:flex;align-items:center;gap:6px}
.big{font-family:Fredoka,sans-serif;font-size:40px;font-weight:600;line-height:1}
.prog-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.bar{height:10px;background:var(--track);border-radius:99px;overflow:hidden}
.bar>span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--g1),var(--g2));animation:grow 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{width:0!important}}
.pill{display:inline-flex;align-items:center;gap:4px;padding:5px 11px;border-radius:99px;background:var(--chip);color:var(--chip-ink);font-size:12.5px;font-weight:800;margin-left:auto}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:18px;border:1.5px solid transparent;font-size:15.5px;font-weight:800;text-decoration:none}
.btn-primary{background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--btn-ink);box-shadow:0 6px 18px rgba(255,120,170,.35)}
.btn-wide{justify-content:space-between;min-height:60px;padding:0 20px}
.btn-ghost{background:var(--surface);border-color:var(--border);color:var(--ink);font-weight:700}
.btn-danger{background:var(--surface);border-color:var(--border);color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid2 .btn{white-space:nowrap;padding:0 12px;font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:2px 20px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;flex-shrink:0;padding:4px 11px;border-radius:99px;background:var(--chip);color:var(--chip-ink);font-size:12px;font-weight:800;white-space:nowrap}
.fchip{flex-shrink:0;min-height:40px;padding:0 15px;border-radius:99px;border:1.5px solid var(--border);background:var(--surface);color:var(--ink);font-size:14px;font-weight:700;white-space:nowrap}
.fchip.on{background:linear-gradient(135deg,var(--g1),var(--g2));border-color:transparent;color:var(--btn-ink)}
.sec-title{font-size:13px;font-weight:800;color:var(--muted);margin-bottom:-6px}
.qline{font-family:Fredoka,sans-serif;font-size:19px;font-weight:500;line-height:1.3}
.snip{font-size:15px;line-height:1.45;color:var(--ink);opacity:.8;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.notice{background:var(--soft);border:1.5px dashed var(--border);border-radius:16px;padding:10px 14px;font-size:13px;color:var(--muted);font-weight:600}
.install{display:flex;align-items:center;gap:12px;background:var(--surface);border:1.5px solid var(--border);border-radius:22px;padding:12px 14px;box-shadow:var(--shadow)}
.install .ic{width:46px;height:46px;border-radius:14px;flex-shrink:0;box-shadow:0 4px 12px rgba(255,120,170,.3)}
.install .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.install .tx b{font-family:Fredoka,sans-serif;font-weight:600;font-size:16px}
.install .tx span{font-size:12.5px;color:var(--muted);font-weight:600}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 12px calc(10px + env(safe-area-inset-bottom))}
.tabbar .in{max-width:456px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border:1.5px solid var(--border);border-radius:24px;box-shadow:var(--shadow);padding:4px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;min-height:56px;background:none;border:0;border-radius:18px;color:var(--muted);font-size:11px;font-weight:700}
.tab.on{color:var(--accent);background:var(--soft)}
.tab.on svg{animation:hop .4s cubic-bezier(.3,.7,.4,1.6)}
@keyframes hop{40%{transform:translateY(-4px) scale(1.12)}}
/* top bar */
.topbar{position:sticky;top:0;z-index:15;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:var(--bg)}
.topbar .mid{font-size:13px;color:var(--muted);font-weight:700;text-align:center}
.icon-btn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;border-radius:14px;color:var(--ink)}
.back-btn{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 10px;border:0;background:none;font-size:15px;font-weight:700;color:var(--ink);border-radius:14px}
/* paper */
.paper{margin:4px 14px 0;background:var(--paper);border-radius:26px;box-shadow:var(--shadow);border:1.5px solid var(--border);position:relative;animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.qhead{position:sticky;top:64px;z-index:5;background:var(--paper);border-radius:26px 26px 0 0;padding:20px 20px 10px;display:flex;flex-direction:column;gap:10px}
.qrow{display:flex;align-items:center;gap:8px}
.pnum{font-family:Fredoka,sans-serif;font-size:20px;font-weight:600;color:var(--accent)}
.qtext{font-family:Fredoka,sans-serif;font-size:23px;font-weight:500;line-height:1.3}
.tools{display:flex;gap:6px;overflow-x:auto;margin:0 -20px;padding:2px 20px 4px;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tool{display:inline-flex;align-items:center;gap:5px;min-height:36px;padding:0 12px;border-radius:99px;border:1.5px solid var(--border);background:transparent;color:var(--muted);font-size:12.5px;font-weight:700;white-space:nowrap;flex-shrink:0}
.tool.on{background:var(--chip);border-color:var(--chip);color:var(--chip-ink)}
.tool:disabled{opacity:.45;cursor:default}
.ans{padding:6px 20px 4px}
.ruled{display:block;width:100%;margin:0;padding:0 2px;border:0;outline:none;resize:none;overflow:hidden;font-family:Nunito,sans-serif;font-weight:600;font-size:var(--ans-size);line-height:var(--ans-lh);color:var(--ink);background-color:transparent;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--ans-lh) - 2px),var(--line) calc(var(--ans-lh) - 2px),var(--line) calc(var(--ans-lh) - 1px),transparent calc(var(--ans-lh) - 1px),transparent var(--ans-lh));background-attachment:local;white-space:pre-wrap;overflow-wrap:anywhere;text-align:left}
textarea.ruled{min-height:calc(var(--ans-lh) * 7)}
textarea.ruled::placeholder{color:var(--muted);opacity:.55}
.ans-view{cursor:text;min-height:calc(var(--ans-lh) * 2)}
.tap-hint{font-size:12px;color:var(--muted);margin-top:6px;font-weight:600}
.ans-foot{padding:6px 20px 18px;display:flex;flex-direction:column;gap:10px}
.dates{font-size:12px;color:var(--muted);line-height:1.55;font-weight:600}
.foot-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.status{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);margin-right:auto;font-weight:700}
.btn-sm{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:99px;border:1.5px solid var(--border);background:var(--surface);color:var(--ink);font-size:13px;font-weight:700}
.btn-sm.primary{background:linear-gradient(135deg,var(--g1),var(--g2));border-color:transparent;color:var(--btn-ink);font-weight:800}
.btn-sm.danger{color:var(--danger)}
.song{display:flex;align-items:center;gap:10px;margin:0 20px 6px;padding:10px 12px;border-radius:16px;background:var(--soft);color:var(--ink);text-decoration:none;font-size:14px}
.song b{font-weight:800;display:block}
.song span{font-size:12px;color:var(--muted)}
.pager{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.pager .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.pager .count{font-size:13px;color:var(--muted);text-align:center;min-width:56px;font-weight:700}
/* lists */
.search{display:flex;align-items:center;gap:8px;min-height:50px;padding:0 14px;background:var(--surface);border:1.5px solid var(--border);border-radius:18px}
.search input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:15px;min-height:44px}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:flex-start;gap:12px;width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:18px;background:var(--surface);text-align:left}
.row-n{width:42px;flex-shrink:0;font-family:Fredoka,sans-serif;font-weight:600;font-size:15px;color:var(--accent);padding-top:1px}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.row-q{font-family:Fredoka,sans-serif;font-size:16px;font-weight:500;line-height:1.3}
.row-meta{display:flex;align-items:center;gap:6px;color:var(--accent);flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--g1);display:inline-block;flex-shrink:0}
.new{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--accent)}
.empty{padding:40px 10px;text-align:center;color:var(--muted);font-weight:600}
/* settings */
.group{background:var(--surface);border:1.5px solid var(--border);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
.item{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:12px 16px;border:0;border-bottom:1.5px solid var(--soft);background:transparent;text-align:left;font-size:15px;font-weight:700}
.group>.item:last-child{border-bottom:0}
.item .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .sub{font-size:12.5px;color:var(--muted);font-weight:600}
.item .ic{width:34px;height:34px;border-radius:12px;background:var(--soft);color:var(--accent);display:inline-flex;align-items:center;justify-content:center}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;background:var(--soft);border-radius:14px}
.seg button{min-height:38px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:13.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.seg-wrap{padding:12px 16px;border-bottom:1.5px solid var(--soft);display:flex;flex-direction:column;gap:8px}
.switch{position:relative;width:50px;height:30px;flex-shrink:0;border-radius:99px;border:0;background:var(--chip);padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .25s cubic-bezier(.3,.7,.4,1.4)}
.switch[aria-checked=true]{background:linear-gradient(135deg,var(--g1),var(--g2))}
.switch[aria-checked=true]::after{left:23px}
/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:800;color:var(--muted)}
.inp{display:flex;align-items:center;min-height:52px;border:1.5px solid var(--border);border-radius:16px;background:var(--surface);padding:0 6px 0 14px}
.inp input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:16px;min-height:48px;font-weight:600}
.inp:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--soft)}
.err{color:var(--danger);font-size:13px;min-height:18px;font-weight:700}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
/* sheet */
#layer:empty{display:none}
.backdrop{position:fixed;inset:0;z-index:50;background:rgba(60,15,40,.4);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:480px;max-height:90vh;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;animation:up .35s cubic-bezier(.2,.9,.3,1.1)}
.grab{width:42px;height:5px;border-radius:9px;background:var(--border);margin:0 auto 4px}
.sheet h3{font-family:Fredoka,sans-serif;font-size:23px;font-weight:600}
@keyframes up{from{transform:translateY(60px);opacity:.4}}
@keyframes fade{from{opacity:0}}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-20px);z-index:80;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.3,.7,.4,1.4);max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:90}
.burst{position:fixed;pointer-events:none;z-index:70;font-size:24px;animation:floatup 1s ease-out forwards}
@keyframes floatup{to{transform:translate(var(--dx),-110px) scale(1.4);opacity:0}}
/* welcome / lock */
.center{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:32px 24px;gap:20px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;border-radius:18px;border:1.5px solid var(--border);background:var(--surface);color:var(--ink);font-size:16px;font-weight:800;box-shadow:var(--shadow)}
.acct{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:18px;border:1.5px solid var(--border);background:var(--surface);text-align:left}
.avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;background:var(--chip);color:var(--chip-ink);flex-shrink:0}
.lockicon{width:76px;height:76px;border-radius:26px;background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--btn-ink);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(255,120,170,.35);animation:bob 3s ease-in-out infinite}
/* book (reader) */
.slide-next{animation:sn .35s cubic-bezier(.2,.8,.2,1)}
.slide-prev{animation:sp .35s cubic-bezier(.2,.8,.2,1)}
@keyframes sn{from{transform:translateX(50px) rotate(1deg);opacity:0}}
@keyframes sp{from{transform:translateX(-50px) rotate(-1deg);opacity:0}}
.ans-read{padding:0 20px 6px;background-clip:content-box;background-origin:content-box}
/* stats */
.stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1.5px solid var(--border);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow)}
.stat .v{font-family:Fredoka,sans-serif;font-size:30px;font-weight:600;line-height:1.1}
.stat .l{font-size:12.5px;color:var(--muted);font-weight:700}
.fbar{display:grid;grid-template-columns:84px 1fr 52px;gap:10px;align-items:center;font-size:13px;font-weight:700}
.fbar .t{height:9px;background:var(--track);border-radius:99px;overflow:hidden}
.fbar .t span{display:block;height:100%;background:linear-gradient(90deg,var(--g1),var(--g2));animation:grow 1s both}
/* print preview */
.pp{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:22px 20px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}

function onThisDay(){
  var now=new Date(),out=[],sod=startOfDay(Date.now());
  Object.keys(db.answers).forEach(function(k){var a=db.answers[k],d=new Date(a.answeredAt);
    if(a.answeredAt<sod&&d.getDate()===now.getDate()){var months=(now.getFullYear()-d.getFullYear())*12+now.getMonth()-d.getMonth();if(months>0)out.push({n:+k,months:months});}});
  return out.sort(function(a,b){return b.months-a.months;});
}
function agoLabel(m){if(m%12===0){var y=m/12;return y===1?'1 year ago today':y+' years ago today';}return m===1?'1 month ago today':m+' months ago today';}
function lastWritten(){var best=null;Object.keys(db.answers).forEach(function(k){var a=db.answers[k],t=Math.max(a.answeredAt,a.editedAt||0);if(!best||t>best.t)best={n:+k,t:t};});return best;}
function readerItems(){
  var out=[];Object.keys(db.answers).map(Number).sort(function(a,b){return a-b;}).forEach(function(n){var a=db.answers[n];if(!a.hidden)out.push({key:'q'+n,n:n,q:QS[n-1][0],f:FEEL[QS[n-1][1]],a:a});});
  db.free.forEach(function(p){if(!p.hidden)out.push({key:'f'+p.id,free:true,id:p.id,q:p.title||'Untitled page',f:'Free page',a:p});});
  return out;
}
function isNew(a){return Math.max(a.answeredAt,a.editedAt||0)>S.prevVisit;}

/* ---------- ui helpers ---------- */
var toastT;
function confetti(){try{var c=document.getElementById('fx'),x=c.getContext('2d'),W=c.width=innerWidth,H=c.height=innerHeight,cols=['#FF7EB0','#FFAE94','#C9A7FF','#FFD1E3','#FFE08A'],P=[];
  for(var i=0;i<120;i++)P.push({x:W/2+(Math.random()-.5)*80,y:H*.45,vx:(Math.random()-.5)*12,vy:-Math.random()*13-4,r:Math.random()*6+4,c:cols[i%cols.length],a:Math.random()*6,va:(Math.random()-.5)*.3,h:Math.random()<.5});
  var t0=performance.now();(function f(t){var k=(t-t0)/1600;x.clearRect(0,0,W,H);if(k>1)return;P.forEach(function(p){p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.globalAlpha=1-k;x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;if(p.h){x.beginPath();x.arc(0,0,p.r/2,0,7);x.fill();}else x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore();});requestAnimationFrame(f);})(t0);}catch(e){}}
function burst(el,emoji){try{var r=el.getBoundingClientRect();for(var i=0;i<6;i++){var s=document.createElement('span');s.className='burst';s.textContent=emoji;s.style.left=(r.left+r.width/2-12)+'px';s.style.top=(r.top-6)+'px';s.style.setProperty('--dx',((Math.random()-.5)*110)+'px');s.style.animationDelay=(i*40)+'ms';document.body.appendChild(s);setTimeout(function(n){return function(){n.remove();};}(s),1300);}}catch(e){}}
function installed(){try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;}catch(e){return false;}}
function installCard(){if(installed()||dev.hideInstall)return '';return '<div class="install"><img class="ic" src="icons/icon-192.png" alt=""><span class="tx"><b>Install the app</b><span>Open it from your home screen, even offline</span></span><button class="btn-sm primary" data-act="install">Install</button><button class="icon-btn" data-act="hideInstall" aria-label="Hide install tip">\u2715</button></div>';}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show');},2400);}

/* ---------- navigation ---------- */
function go(screen,params,push){
  flushSave();
  if(push!==false&&S.screen&&S.screen!==screen)S.stack.push({s:S.screen,p:S.params});
  S.fresh={};S.screen=screen;S.params=params||{};S.editing=false;
  render();window.scrollTo(0,0);
}
function tab(screen){S.stack=[];go(screen,{},false);}
function back(){var p=S.stack.pop();if(p)go(p.s,p.p,false);else tab(isOwner()?'home':'rhome');}
function start(){
  closeSheet();S.stack=[];
  if(LIVE&&(!LV||LV.busy()))return go('loading',{},false);
  if(!dev.account)return go('welcome',{},false);
  if(!S.unlocked){
    if(isOwner()&&!db.ownerHash)return go('setup',{},false);
    return go('lock',{},false);
  }
  go(isOwner()?'home':'rhome',{},false);
}

function tabbar(){
  var t=isOwner()?[['home','Home',I.home],['contents','Questions',I.list],['free','Free pages',I.pages],['stats','Stats',I.stats],['settings','Settings',I.gear]]
                 :[['rhome','Home',I.home],['book','Read',I.book],['rlist','Pages',I.list],['settings','Settings',I.gear]];
  var cur=S.screen==='freeEdit'?'free':S.screen==='print'?'settings':S.screen;
  return '<nav class="tabbar" aria-label="Main"><div class="in">'+t.map(function(x){return '<button class="tab'+(cur===x[0]?' on':'')+'" data-act="tab" data-to="'+x[0]+'"'+(cur===x[0]?' aria-current="page"':'')+'>'+x[2]+'<span>'+x[1]+'</span></button>';}).join('')+'</div></nav>';
}
function render(){
  var v={loading:vLoading,welcome:vWelcome,setup:vSetup,lock:vLock,home:vHome,contents:vContents,page:vPage,free:vFree,freeEdit:vFreeEdit,stats:vStats,settings:vSettings,print:vPrint,rhome:vRHome,book:vBook,rlist:vContents}[S.screen];
  var html=v();
  var tabs=['home','contents','free','stats','settings','rhome','rlist'].indexOf(S.screen)>=0;
  app.className=tabs?'has-tabs':(S.screen==='page'||S.screen==='book')?'has-pager':'';
  app.innerHTML=html+(tabs?tabbar():'');
  var ta=document.getElementById('ta');if(ta){grow(ta);}
  if(S.screen==='book')bindSwipe();
}
function grow(el){
  var lh=parseFloat(getComputedStyle(el).lineHeight)||42;
  el.style.height='auto';
  var lines=Math.ceil((el.scrollHeight-1)/lh);
  el.style.height=Math.max(lh*7,(lines+1)*lh)+'px';
}

function vHome(){
  var n=count(),m=null;for(var i=0;i<MS.length;i++){if(MS[i]>n){m=MS[i];break;}}
  var next=nextUnanswered(),q=qotd(),st=streak(),otd=onThisDay(),last=lastWritten();

  if(q)h+='<button class="card" data-act="open" data-n="'+q+'"><span class="card-title">'+I.sparkle+' Question of the day · #'+q+'</span><span class="qline">'+esc(QS[q-1][0])+'</span><span style="display:flex;justify-content:space-between;align-items:center"><span class="chip">'+FEEL[QS[q-1][1]]+'</span><span class="new">Write '+I.chev+'</span></span></button>';
  if(otd.length){var o=otd[0],a=db.answers[o.n];h+='<button class="card" data-act="open" data-n="'+o.n+'"><span class="card-title">'+I.cal+' On this day · '+agoLabel(o.months)+'</span><span class="qline">'+esc(QS[o.n-1][0])+'</span><span class="snip">'+esc(a.text)+'</span></button>';}
  if(n)h+='<button class="btn btn-ghost" data-act="randomMemory">'+I.book+' Read a random memory</button>';

  if(last){var la=db.answers[last.n];h+='<button class="card" data-act="open" data-n="'+last.n+'"><span class="card-title">Last thing you wrote · #'+last.n+'</span><span class="qline">'+esc(QS[last.n-1][0])+'</span><span class="snip">'+esc(la.text)+'</span></button>';}

function ownerFilters(){return ['All','Not yet','Answered','Favorites','Skipped','Hidden'].concat(FEEL);}
function readerFilters(){return ['All','New'].concat(FEEL,['Free page']);}
function vContents(){
  var own=isOwner();var fl=own?ownerFilters():readerFilters();if(fl.indexOf(S.filter)<0)S.filter='All';
  return '<main class="screen"><div><h1 class="serif" style="font-size:32px">'+(own?'All questions':'All pages')+'</h1><p class="muted small" id="cnt"></p></div>'+
   '<label class="search">'+I.search+'<span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search</span><input id="q" type="search" data-input="search" placeholder="'+(own?'Search questions & answers, or #number':'Search')+'" value="'+esc(S.query)+'"></label>'+
   '<div class="chips">'+fl.map(function(f){return '<button class="fchip'+(S.filter===f?' on':'')+'" data-act="filter" data-f="'+esc(f)+'">'+esc(f)+'</button>';}).join('')+'</div>'+
   '<div class="rows" id="rows">'+rowsHtml()+'</div></main>';
}
function rowsHtml(){
  var own=isOwner(),q=S.query.trim().toLowerCase(),f=S.filter,out=[],shown=0;
  var num=q.replace(/^#/,'');
  if(own&&/^\d+$/.test(num)&&+num>=1&&+num<=TOTAL){out.push('<button class="row" data-act="open" data-n="'+(+num)+'"><span class="row-n">'+I.next+'</span><span class="row-main"><span class="row-q">Go to page #'+(+num)+'</span></span></button>');}
  if(own){
    for(var n=1;n<=TOTAL;n++){
      var Q=QS[n-1],a=db.answers[n],fe=FEEL[Q[1]];
      if(f==='Not yet'&&a)continue;if(f==='Answered'&&!a)continue;if(f==='Favorites'&&!(a&&a.fav))continue;
      if(f==='Skipped'&&!db.skipped[n])continue;if(f==='Hidden'&&!(a&&a.hidden))continue;
      if(FEEL.indexOf(f)>=0&&fe!==f)continue;
      var inQ=!q||Q[0].toLowerCase().indexOf(q)>=0,inA=q&&a&&a.text.toLowerCase().indexOf(q)>=0;
      if(q&&!inQ&&!inA)continue;
      shown++;
      out.push('<button class="row" data-act="open" data-n="'+n+'"><span class="row-n">#'+n+'</span><span class="row-main"><span class="row-q">'+esc(Q[0])+'</span>'+(inA?'<span class="snip">'+esc(a.text)+'</span>':'')+
        '<span class="row-meta"><span class="chip">'+esc(fe)+'</span>'+(a?I.check:'')+(a&&a.fav?I.heartF:'')+(a&&a.hidden?I.eyeOff:'')+(db.skipped[n]?I.skip:'')+'</span></span></button>');
    }
  }else{
    readerItems().forEach(function(it,idx){
      if(f==='New'&&!isNew(it.a))return;if(f!=='All'&&f!=='New'&&it.f!==f)return;
      if(q&&it.q.toLowerCase().indexOf(q)<0&&it.a.text.toLowerCase().indexOf(q)<0)return;
      shown++;
      out.push('<button class="row" data-act="readAt" data-i="'+idx+'"><span class="row-n">'+(it.free?I.pages:'#'+it.n)+'</span><span class="row-main"><span class="row-q">'+esc(it.q)+'</span><span class="snip">'+esc(it.a.text)+'</span><span class="row-meta"><span class="chip">'+esc(it.f)+'</span>'+(isNew(it.a)?'<span class="new"><span class="dot"></span>New</span>':'')+'</span></span></button>');
    });
  }
  setTimeout(function(){var c=document.getElementById('cnt');if(c)c.textContent=shown+(own?' of '+TOTAL+' shown · '+count()+' written':' pages');},0);
  return out.join('')||'<p class="empty">Nothing here yet.</p>';
}

   '<button class="tool'+(a&&a.hidden?' on':'')+'" data-act="hide" aria-pressed="'+!!(a&&a.hidden)+'"'+d+'>'+I.eyeOff+' Hide from readers</button>'+

function bindSwipe(){
  var el=document.getElementById('bookpage');if(!el)return;var x0=null,y0=null;
  el.addEventListener('touchstart',function(e){x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
  el.addEventListener('touchend',function(e){if(x0===null)return;var dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){turn(dx<0?1:-1);}},{passive:true});

/* ---------- saving ---------- */
function scheduleSave(fn){clearTimeout(S.saveT);S.pendingSave=fn;S.saveT=setTimeout(flushSave,500);}
function flushSave(){clearTimeout(S.saveT);var f=S.pendingSave;S.pendingSave=null;if(f)f();}
function saveAnswer(n,text){
  var a=db.answers[n],now=Date.now();
  if(!text.trim())return;
  if(!a){db.answers[n]={text:text,answeredAt:now,editedAt:null};S.fresh['q'+n]=1;delete db.skipped[n];if(S.screen==='page'&&S.params.n===n)S.editing=true;
    saveDb();markPending();refreshPageBits(n);checkMilestone();return;}
  if(a.text===text)return;
  a.text=text;if(!S.fresh['q'+n])a.editedAt=now;
  saveDb();markPending();refreshPageBits(n);
}
function refreshPageBits(n){
  var a=db.answers[n],el;
  if((el=document.getElementById('dates')))el.innerHTML=datesHtml(a);
  if((el=document.getElementById('tools')))el.innerHTML=toolsHtml(n);
  if((el=document.getElementById('foot')))el.innerHTML=footBtns(n);
}
function checkMilestone(){
  var n=count();
  if(MS.indexOf(n)>=0&&db.celebrated.indexOf(n)<0){db.celebrated.push(n);saveDb();
    setTimeout(function(){confetti();sheet('<div style="text-align:center;display:flex;flex-direction:column;gap:12px;padding:10px 0"><span class="kicker">Milestone</span><span class="cover-name" style="font-size:64px">'+n+'</span><p class="tagline">'+esc(MS_TEXT[n])+'</p></div><button class="btn btn-primary" data-act="closeSheet">Keep writing</button>');},300);}
}
function saveFree(id,field,val){
  var p=findFree(id);if(!p||p[field]===val)return;p[field]=val;if(!S.fresh['f'+id])p.editedAt=Date.now();
  saveDb();markPending();var el=document.getElementById('dates');if(el)el.innerHTML=datesHtml(p);
}

   return;
  }
  if(db.readerOn){confirmBox('Turn off reading?','Nobody will be able to read your book until you turn it back on.','Turn off',true).then(function(ok){if(!ok)return;db.readerOn=false;saveDb();render();});}
  else if(!db.readerHash){ACT.chgReader();}
  else{db.readerOn=true;saveDb();render();toast('Reading is on');}
 },
 showReader:function(){var el=document.getElementById('rpw');if(el)el.textContent=db.readerPlain||'(not set)';},
 chgOwner:function(){sheet('<h3>Change your password</h3><form data-form="chgOwner" style="display:flex;flex-direction:column;gap:12px" novalidate>'+pwField('c0','Current password')+pwField('c1','New password')+pwField('c2','Type it again')+'<p class="err" id="err"></p><button class="btn btn-primary" type="submit">Save password</button></form>');},
 chgReader:function(){sheet('<h3>Reader password</h3><p class="muted small">Readers use this after signing in. They can only read.</p><form data-form="chgReader" style="display:flex;flex-direction:column;gap:12px" novalidate>'+pwField('c1','New reader password')+pwField('c2','Type it again')+'<p class="err" id="err"></p><button class="btn btn-primary" type="submit">Save reader password</button></form>');},
 editCover:function(){sheet('<h3>Customize cover</h3><form data-form="cover" style="display:flex;flex-direction:column;gap:12px" novalidate>'+txtField('k1','Small title',db.cover.kicker)+txtField('k2','Name',db.cover.name)+txtField('k3','Tagline',db.cover.tagline)+'<button class="btn btn-primary" type="submit">Save cover</button></form>');},
 install:function(){if(window.__bip){var bp=window.__bip;window.__bip=null;bp.prompt();return;}sheet('<h3>Install the app</h3><div class="card"><p class="card-title">Android (Chrome)</p><p>Tap the <b>⋮ menu</b>, then <b>Add to Home screen</b> or <b>Install app</b>.</p></div><div class="card"><p class="card-title">iPhone (Safari)</p><p>Tap <b>Share</b>, then <b>Add to Home Screen</b>.</p></div><p class="muted small">Once installed it opens like a normal app, even offline.</p><button class="btn btn-primary" data-act="closeSheet">Got it</button>');},
 backup:function(){sheet('<h3>Backup</h3><p class="muted">Saves every answer, its date, and your free pages in one text file.</p><button class="btn btn-primary" data-act="dlBackup">'+I.download+' Download .txt</button><button class="btn btn-ghost" data-act="cpBackup">'+I.copy+' Copy everything</button>');},
 dlBackup:function(){var t=backupText();try{var b=new Blob([t],{type:'text/plain'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='cassy-book-backup.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},2000);}catch(e){}toast(LIVE?'Backup downloaded':'Download started (in this preview, use Copy if nothing happens)');},
 cpBackup:function(){var t=backupText();try{navigator.clipboard.writeText(t).then(function(){toast('Copied all your answers');},function(){toast('Couldn’t copy here');});}catch(e){toast('Couldn’t copy here');}},
 printHidden:function(){S.printHidden=!S.printHidden;render();},
 doPrint:function(){buildPrint();try{window.print();}catch(e){}if(!LIVE)toast('If nothing opened, printing works once the app is live');},
 clearSamples:function(){confirmBox('Clear sample answers?','Your passwords and settings stay. All answers and free pages are removed.','Clear',true).then(function(ok){if(!ok)return;db.answers={};db.skipped={};db.free=[];db.celebrated=[];db.samples=false;saveDb();tab('home');toast('Fresh start. Page 1 is waiting.');});},
 resetAll:function(){confirmBox('Reset the mockup?','Everything goes back to the start, including passwords.','Reset',true).then(function(ok){if(!ok)return;db=freshDb(true);saveDb();dev.account=null;dev.pending=0;dev.offline=false;dev.readerPos=null;dev.readerLastVisit=Date.now()-2.5*DAY;saveDev();S.unlocked=false;start();});},
 goPrint:function(){go('print');},
 readAt:function(el){S.bookIdx=+el.dataset.i;S.bookDir='';S.stack=[];go('book',{},false);},
 readRandom:function(){var n=readerItems().length;if(!n)return;S.bookIdx=Math.floor(Math.random()*n);S.bookDir='next';S.stack=[];go('book',{},false);},
 bookPrev:function(){turn(-1);},
 bookNext:function(){turn(1);}
};
function backupText(){
  var L=[db.cover.kicker.toUpperCase()+' '+db.cover.name.toUpperCase(),db.cover.tagline,'Backup: '+fmtDT(Date.now()),''];
  Object.keys(db.answers).map(Number).sort(function(a,b){return a-b;}).forEach(function(n){var a=db.answers[n];
    L.push('#'+n+' ['+FEEL[QS[n-1][1]]+']'+(a.fav?' [favorite]':'')+(a.hidden?' [hidden]':''),QS[n-1][0],a.text,'Answered '+fmtDT(a.answeredAt)+(a.editedAt?' | Edited '+fmtDT(a.editedAt):'')+(a.song?' | Song: '+a.song.url:''),'');});
  db.free.forEach(function(p){L.push('[Free page] '+(p.title||'Untitled'),p.text,'Written '+fmtDT(p.answeredAt)+(p.editedAt?' | Edited '+fmtDT(p.editedAt):''),'');});
  return L.join('\n');
}
function buildPrint(){
  var h='<section class="pb-cover"><div class="pb-n">'+esc(db.cover.kicker)+'</div><h1>'+esc(db.cover.name)+'</h1><div class="pb-a">'+esc(db.cover.tagline)+'</div></section>';
  printItems().forEach(function(it){h+='<section class="pb-item"><div class="pb-n">'+esc(it.label)+'</div><p class="pb-q">'+esc(it.q)+'</p><div class="pb-a">'+esc(it.a.text)+'</div><div class="pb-d">'+fmtD(it.a.answeredAt)+(it.a.editedAt?' · edited '+fmtD(it.a.editedAt):'')+'</div></section>';});
  document.getElementById('printRoot').innerHTML=h;
}

/* ---------- forms ---------- */
function val(id){var e=document.getElementById(id);return e?e.value:'';}
function err(m){var e=document.getElementById('err');if(e){e.textContent=m;var f=e.closest('form');if(f){f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');}}}
var FORM={
 setup:function(){
  var p1=val('p1'),p2=val('p2'),ron=document.getElementById('rsw').getAttribute('aria-checked')==='true',r1=val('r1'),r2=val('r2');
  if(p1.length<4)return err('Your password needs at least 4 characters.');
  if(p1!==p2)return err('Your two passwords don’t match.');
  if(ron){if(r1.length<4)return err('The reader password needs at least 4 characters.');if(r1!==r2)return err('The reader passwords don’t match.');if(r1===p1)return err('Use a different password for readers.');}
  if(LIVE){var btn=document.querySelector('form [type=submit]');btn.disabled=true;btn.textContent='Setting up\u2026';hash(p1).then(function(h){db.ownerHash=h;db.readerOn=false;saveDb();return ron?LV.changeReader(r1):null;}).then(function(){S.unlocked=true;toast('Your book is ready');start();},function(e){btn.disabled=false;btn.textContent='Save and open my book';err(e.message);});return;}
  Promise.all([hash(p1),ron?hash(r1):Promise.resolve(null)]).then(function(h){db.ownerHash=h[0];db.readerOn=ron;db.readerHash=h[1];db.readerPlain=ron?r1:null;saveDb();S.unlocked=true;toast('Your book is ready');start();});
 },
 lock:function(){
  var p=val('lp');if(!p)return err('Type your password.');
  hash(p).then(function(h){
   if(isOwner()){if(h!==db.ownerHash)return err('Wrong password. Try again.');}
   else if(LIVE){LV.readerUnlock(p).then(function(r){if(!r.ok)return err(r.msg);S.prevVisit=dev.readerLastVisit||0;dev.readerLastVisit=Date.now();saveDev();S.unlocked=true;start();});return;}
   else{if(!db.readerOn||!db.readerHash)return err('The owner has turned reading off.');if(h!==db.readerHash)return err('Wrong password. Try again.');
     S.prevVisit=dev.readerLastVisit||0;dev.readerLastVisit=Date.now();saveDev();}
   S.unlocked=true;start();
  });
 },
 chgOwner:function(){
  var c0=val('c0'),c1=val('c1'),c2=val('c2');
  hash(c0).then(function(h){if(h!==db.ownerHash)return err('Your current password is wrong.');if(c1.length<4)return err('Use at least 4 characters.');if(c1!==c2)return err('The new passwords don’t match.');if(c1===db.readerPlain)return err('Use something different from the reader password.');
   hash(c1).then(function(n){db.ownerHash=n;saveDb();closeSheet();toast('Password changed');});});
 },
 chgReader:function(){
  var c1=val('c1'),c2=val('c2');if(c1.length<4)return err('Use at least 4 characters.');if(c1!==c2)return err('The passwords don’t match.');
  Promise.all([hash(c1)]).then(function(h){if(h[0]===db.ownerHash)return err('Use something different from your own password.');
   if(LIVE){err('');var b=document.querySelector('.sheet [type=submit]');b.disabled=true;b.textContent='Saving\u2026';LV.changeReader(c1).then(function(){closeSheet();render();toast('Reader password saved');},function(e){b.disabled=false;b.textContent='Save reader password';err(e.message);});return;}db.readerHash=h[0];db.readerPlain=c1;db.readerOn=true;saveDb();closeSheet();render();toast('Reader password saved');});
 },
 song:function(){
  var u=val('su').trim(),t=val('st').trim(),ok=false;try{var x=new URL(u);ok=x.protocol==='https:'||x.protocol==='http:';}catch(e){}
  if(!ok)return err('Paste a full link that starts with https://');
  var a=db.answers[S.params.n];a.song={url:u,title:t};saveDb();markPending();closeSheet();document.getElementById('songbox').innerHTML=songHtml(a.song);refreshPageBits(S.params.n);toast('Song added');
 },
 cover:function(){db.cover={kicker:val('k1').trim()||'1000 things to write about',name:val('k2').trim()||'Cassy',tagline:val('k3').trim()};saveDb();closeSheet();render();toast('Cover updated');}
};

/* ---------- events ---------- */
document.addEventListener('click',function(e){var el=e.target.closest('[data-act]');if(!el||el.disabled)return;var f=ACT[el.dataset.act];if(f)f(el,e);});
document.addEventListener('submit',function(e){var f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();var h=FORM[f.dataset.form];if(h)h();});
document.addEventListener('input',function(e){
  var k=e.target.dataset&&e.target.dataset.input;if(!k)return;
  if(k==='search'){S.query=e.target.value;document.getElementById('rows').innerHTML=rowsHtml();}
  else if(k==='answer'){grow(e.target);var n=S.params.n,v=e.target.value;var st=document.getElementById('status');if(st&&db.answers[n])st.innerHTML='Saving…';scheduleSave(function(){saveAnswer(n,v);var s2=document.getElementById('status');if(s2)s2.innerHTML=statusHtml();});}
  else if(k==='free'){grow(e.target);var id=S.params.id,fv=e.target.value;scheduleSave(function(){saveFree(id,'text',fv);});}
  else if(k==='ftitle'){var id2=S.params.id,tv=e.target.value;scheduleSave(function(){saveFree(id2,'title',tv);});}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&layer.innerHTML){closeSheet();if(S.cf){S.cf(false);S.cf=null;}}
  if(S.screen==='book'&&!layer.innerHTML){if(e.key==='ArrowRight')turn(1);if(e.key==='ArrowLeft')turn(-1);}
});
window.addEventListener('resize',function(){var ta=document.getElementById('ta');if(ta)grow(ta);});
document.addEventListener('visibilitychange',function(){if(document.hidden)flushSave();});

function softRender(){if(layer.innerHTML)return;var a=document.activeElement;if(a&&(a.tagName==='TEXTAREA'||a.tagName==='INPUT')&&app.contains(a))return;if(S.screen==='page'&&S.editing)return;render();}
function statusRefresh(){var s=document.getElementById('status');if(s&&s.textContent.indexOf('Saving')<0&&(S.screen!=='page'||db.answers[S.params.n]))s.innerHTML=statusHtml();if(S.screen==='settings')softRender();}
applyPrefs();
if(LIVE){
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();window.__bip=e;});
  window.addEventListener('online',statusRefresh);window.addEventListener('offline',statusRefresh);
  if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(function(){});
  go('loading',{},false);
  var API={getDb:function(){return db;},setDb:function(v){db=v;},dev:dev,S:S,start:start,render:render,softRender:softRender,statusRefresh:statusRefresh,toast:toast,hash:hash,saveDev:saveDev,freshDb:freshDb};
  import('./live.js').then(function(m){LV=m;m.init(API);}).catch(function(){app.innerHTML='<main class="center"><p class="muted">Couldn\u2019t open the app. Check your internet, then close and reopen it.</p></main>';});
}else start();
})();
</script>
